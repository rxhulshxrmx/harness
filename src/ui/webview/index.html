<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}'; img-src {{cspSource}} data:;" />
<link rel="stylesheet" href="{{styleUri}}" />
<title>Harness</title>
</head>
<body>
  <div id="header">
    <div id="sessionTitle">New Session</div>
    <button id="newSessionBtn" class="icon-btn" title="New session">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>
    </button>
    <button id="historyBtn" class="icon-btn" title="Session history">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.5 1.5"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" title="Settings">
      <svg viewBox="0 0 16 16" fill="currentColor" stroke="none">
        <circle cx="8" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6" transform="rotate(60 8 8)"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6" transform="rotate(120 8 8)"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6" transform="rotate(180 8 8)"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6" transform="rotate(240 8 8)"/>
        <rect x="6.9" y="0.5" width="2.2" height="2.4" rx="0.6" transform="rotate(300 8 8)"/>
      </svg>
    </button>
    <div id="historyPanel"></div>
  </div>
  <div id="settingsPanel">
    <div class="settings-section-title">SAP AI Core credentials</div>
    <div class="settings-field">
      <label for="clientIdInput">Client ID</label>
      <input id="clientIdInput" type="text" placeholder="Enter AI Core Client ID..." />
    </div>
    <div class="settings-field">
      <label for="clientSecretInput">Client secret</label>
      <input id="clientSecretInput" type="password" placeholder="Enter AI Core Client Secret..." />
      <p class="settings-hint" id="clientSecretHint" style="display: none;">Secret is set. Re-enter it to change.</p>
    </div>
    <div class="settings-field">
      <label for="aiCoreBaseUrlInput">AI Core base URL</label>
      <input id="aiCoreBaseUrlInput" type="text" placeholder="Enter AI Core Base URL..." />
    </div>
    <div class="settings-field">
      <label for="tokenUrlInput">Auth URL</label>
      <input id="tokenUrlInput" type="text" placeholder="Enter AI Core Auth URL..." />
    </div>
    <div class="settings-field">
      <label for="resourceGroupInput">Resource group</label>
      <input id="resourceGroupInput" type="text" placeholder="default" />
    </div>
    <div class="settings-field">
      <label for="deploymentIdInput">Deployment ID</label>
      <input id="deploymentIdInput" type="text" placeholder="d0123456789abcdef" />
    </div>
    <p class="settings-hint">These values come from your SAP AI Core service key. They're stored locally and only used to call the API from this extension — the secret is kept in your OS keychain, never in settings.json. <a href="#" id="openSettingsJsonLink">Open settings.json</a></p>
  </div>
  <div id="messages"></div>
  <div id="touchedFiles"></div>
  <div id="composerWrap">
    <div id="composer">
      <textarea id="input" placeholder="Ask Harness to do anything..."></textarea>
      <div id="composerFooter">
        <button id="approvalModeBtn" class="mode-pill" title="Toggle approval mode"></button>
        <span class="model-label" id="modelLabel">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.5" y="7" width="9" height="6" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
          <span id="modelName">GPT-5</span>
        </span>
        <span class="spacer"></span>
        <button id="sendBtn" title="Send">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5V3.5M3.5 8 8 3.5 12.5 8"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
